{# templates/user_public.html #}
{% extends "base.html" %}
{% from "_badges.html" import render_badges %}
{% block content %}

<style>
  .public-user-head > *{ min-width:0; }
  .public-user-name{ overflow-wrap:anywhere; }
  @media (max-width:480px){
    .public-user-head{ flex-wrap:wrap; gap:.75rem; }
  }

  @supports (-webkit-touch-callout: none) {
    @media (min-width:769px) and (max-width:1376px) and (min-height:600px) and (any-pointer:coarse) {
      .public-user-head {
        flex-wrap: wrap;
        gap: .75rem;
      }

      .public-user-head > * {
        min-width: 0;
      }
    }
  }
</style>

<div class="d-flex align-items-center justify-content-between mb-3 public-user-head">
  <h3 class="mb-0 d-flex align-items-center gap-1 public-user-name">
    {{ user.first_name }} {{ user.last_name }}
    {{ render_badges(user, '22px') }}
  </h3>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-light" href="/messages/start?user_id={{ user.id }}">Send Message</a>
  </div>
</div>

{# ... rest of your page as is ... #}

{% endblock %}
